<style>
:root{
  --ink:#14100F;
  --page:#FFFFFF;
  --gut:#FFFFFF;
  --mute:#6E6A66;
  --tag:#D8352A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  min-height:100dvh;
  align-items:flex-start;
  background:var(--page);
  color:var(--ink);
  font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  display:flex;
  justify-content:center;
  padding:18px 14px calc(34px + env(safe-area-inset-bottom));
}
.page{width:100%;max-width:620px;display:grid;gap:10px;align-content:start;}

/* 첫 칸 — 유일하게 검은 칸 */
.head{
  display:flex;
  align-items:center;
  gap:16px;
  padding:22px 20px;
  background:var(--ink);
  color:#FFFFFF;
  border:3px solid var(--ink);
}
.head{padding:26px 22px;}
.head svg{flex:none;width:88px;height:88px;display:block;}
.head h1{
  margin:0;
  font-size:54px;
  font-weight:800;
  letter-spacing:-0.07em;
  line-height:0.9;
}
@media (max-width:380px){
  .head{gap:13px;padding:20px 17px;}
  .head svg{width:70px;height:70px;}
  .head h1{font-size:43px;}
}

/* 칸 */
.cell{
  position:relative;
  display:flex;
  align-items:center;
  gap:13px;
  padding:17px 16px;
  border:3px solid var(--ink);
  background:var(--page);
  color:var(--ink);
  text-decoration:none;
  transition:background .09s linear, color .09s linear;
}
.cell svg{flex:none;width:30px;height:30px;display:block;color:inherit;}
.cell b{
  display:block;
  font-size:18.5px;
  font-weight:800;
  letter-spacing:-0.045em;
  line-height:1.2;
}
.cell span{
  display:block;
  margin-top:3px;
  font-size:12.5px;
  font-weight:600;
  letter-spacing:-0.02em;
  color:var(--mute);
  transition:color .09s linear;
}
.cell:hover,.cell:active,.cell:focus-visible{background:var(--ink);color:#FFFFFF;outline:none;}
.cell:hover span,.cell:active span,.cell:focus-visible span{color:#B9B5B0;}
.cell:focus-visible{box-shadow:0 0 0 3px #FFFFFF inset;}

.wide{grid-column:1 / -1;}
.wide b{font-size:22px;}
.wide svg{width:38px;height:38px;}

.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.mini{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.mini .cell{
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:9px;
  padding:15px 8px;
}
.mini .cell b{font-size:14.5px;letter-spacing:-0.05em;}
.mini .cell svg{width:26px;height:26px;}
@media (max-width:340px){ .mini .cell b{font-size:13px;} }
.row .cell{
  flex-direction:column;
  align-items:flex-start;
  justify-content:space-between;
  gap:16px;
  min-height:118px;
  padding:16px 15px 15px;
}
.row .cell > div{min-height:42px;}
.row .cell b{font-size:17.5px;}
@media (max-width:344px){ .row .cell b{font-size:16px;} }

.cell .tag{
  position:absolute;
  margin:0;
  top:-3px;
  right:-3px;
  padding:4px 7px;
  background:var(--tag);
  color:#FFFFFF;
  font-size:11px;
  font-weight:800;
  letter-spacing:-0.02em;
  line-height:1;
  transition:none;
}

.foot{
  margin-top:4px;
  font-size:12px;
  font-weight:500;
  color:var(--mute);
  letter-spacing:-0.02em;
}
</style>
</head>
